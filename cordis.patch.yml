# dsh-thinking-effort-slide-bar bundle patch.
#
# Official bundle semantics (see deepseek-harness "Package and install a
# plugin"): a bundle ships one configuration layer; `dsh plugin
# --profile <name> add ...` appends this package to dsh.profile.bundles and
# applies this insert. The row only has to exist so the Loader scans the
# package and discovers its `dsh.client` declaration, which registers the
# Web Client bundle (./client) with the host client-modules table.
#
# The same layer applies to the DSH Desktop profile (dsh plugin --profile
# desktop add ...) — the desktop shell composes dsh-base + dsh-web-app +
# profile bundles over the same Loader path, so a Web Client plugin needs no
# Desktop-specific row here.
#
# Remove any leftover profile-level mount of the same id to avoid a double
# mount (a second insert at the same id would override, not merge).
- insert:
    - id: thinking-effort-slide-bar
      name: dsh-thinking-effort-slide-bar
